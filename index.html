<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sorteador de letras para partidas de STOP, sem repetição e com cronômetro.">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STOP!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6262'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' font-family='Arial' font-weight='900' fill='%23fff5d9'%3ES%3C/text%3E%3C/svg%3E">
<title>STOP! — Sorteador</title>
<style>
:root{
  color-scheme:dark;
  --ink:#101827;
  --ink-2:#1a2639;
  --paper:#fff5d9;
  --paper-2:#f5e7bf;
  --coral:#ff6262;
  --coral-dark:#d83d4d;
  --yellow:#ffd447;
  --mint:#54dfa4;
  --blue:#6e8cff;
  --white:#fffdf6;
  --display:"Cooper Black","Rockwell Extra Bold","Arial Black",ui-rounded,sans-serif;
  --ui:"Trebuchet MS","Avenir Next",Verdana,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  position:relative;
  isolation:isolate;
  margin:0;
  height:100vh;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));
  color:var(--white);
  font-family:var(--ui);
  background:
    radial-gradient(circle at 16% 18%,#ff62622e 0 12%,transparent 31%),
    radial-gradient(circle at 86% 82%,#54dfa426 0 10%,transparent 28%),
    var(--ink);
}
body::before{
  position:fixed;
  inset:0;
  z-index:-2;
  content:"";
  opacity:.22;
  background-image:radial-gradient(#fff5d9 1.2px,transparent 1.2px);
  background-size:18px 18px;
  -webkit-mask-image:linear-gradient(135deg,#000,transparent 72%);
  mask-image:linear-gradient(135deg,#000,transparent 72%);
}
body::after{
  position:fixed;
  right:-12vmax;
  bottom:-20vmax;
  z-index:-1;
  width:44vmax;
  height:44vmax;
  content:"";
  border:clamp(28px,5vmax,72px) solid #ffd44717;
  border-radius:50%;
  transform:rotate(-14deg);
}

.app{width:min(100%,540px);text-align:center}
.brand{margin-bottom:9px}
.logo{
  color:var(--white);
  font:900 clamp(2.55rem,8.7dvh,4.7rem)/.82 var(--display);
  letter-spacing:.035em;
  text-shadow:4px 4px 0 var(--coral-dark),8px 8px 0 #080c14;
  transform:rotate(-1.5deg);
}
.logo span{
  display:inline-block;
  color:var(--yellow);
  transform:rotate(8deg) translateY(1px);
}
.subtitle{
  margin:10px 0 0;
  color:#d9e2ed;
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.card{
  position:relative;
  padding:16px 15px 14px;
  color:var(--ink);
  background:var(--paper);
  border:3px solid #090e18;
  border-radius:25px 20px 27px 18px;
  box-shadow:9px 9px 0 var(--coral-dark),14px 14px 0 #080c14;
}
.card::before{
  position:absolute;
  top:9px;
  left:12px;
  width:34px;
  height:8px;
  content:"";
  background:var(--yellow);
  border:2px solid var(--ink);
  transform:rotate(-7deg);
}

.gear,.close{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  padding:0;
  color:var(--white);
  font-size:1.25rem;
  line-height:1;
  background:var(--ink-2);
  border:2px solid #090e18;
  border-radius:50%;
  box-shadow:3px 3px 0 var(--coral);
}
.gear{position:absolute;top:9px;right:9px;z-index:3}
.gear.off{opacity:.35;pointer-events:none;box-shadow:none}

.letter{
  --size:min(58vw,31dvh,248px);
  position:relative;
  isolation:isolate;
  width:var(--size);
  height:var(--size);
  margin:0 auto 14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--white);
  background:var(--ink-2);
  border:4px solid #090e18;
  border-radius:27% 21% 25% 20%;
  box-shadow:7px 7px 0 #090e18;
  cursor:default;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  transform:rotate(.6deg);
}
.letter::after{
  position:absolute;
  inset:0;
  z-index:1;
  content:"";
  pointer-events:none;
  opacity:.2;
  background-image:radial-gradient(#fff 1.1px,transparent 1.1px);
  background-size:13px 13px;
  mix-blend-mode:overlay;
}
.letter .fill{
  position:absolute;
  inset:0;
  z-index:0;
  background:linear-gradient(145deg,var(--mint),#19b77b);
  transform:scaleY(1);
  transform-origin:bottom;
  will-change:transform;
}
.letter.warn .fill{background:linear-gradient(145deg,var(--yellow),#f59e0b)}
.letter.danger .fill{background:linear-gradient(145deg,var(--coral),#dc263d)}
.letter #txt{
  position:relative;
  z-index:2;
  font:900 calc(var(--size)*.53)/1 var(--display);
  text-shadow:3px 4px 0 #0b111d;
}
.letter.live{
  cursor:pointer;
  animation:ready 1.15s ease-in-out infinite alternate;
}
.letter.live:active{transform:rotate(.6deg) scale(.96);box-shadow:3px 3px 0 #090e18}
.letter.danger{animation:pulse .45s ease-in-out infinite alternate}
.letter.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1)}
.countdown #txt{animation:countPulse .75s ease}

@keyframes ready{to{box-shadow:7px 7px 0 #090e18,0 0 0 5px #6e8cff88}}
@keyframes pulse{to{transform:rotate(.6deg) scale(1.035)}}
@keyframes pop{0%{transform:rotate(-5deg) scale(.78)}65%{transform:rotate(2deg) scale(1.06)}100%{transform:rotate(.6deg) scale(1)}}
@keyframes countPulse{0%{transform:scale(.65);opacity:.25}65%{transform:scale(1.16);opacity:1}100%{transform:scale(1)}}

.buttons{display:flex;gap:10px;justify-content:center}
button{
  border:0;
  border-radius:13px 10px 14px 9px;
  padding:12px 18px;
  color:var(--ink);
  font:900 .95rem var(--ui);
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;
}
button:hover:not(:disabled){filter:brightness(1.04)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 transparent!important}
button:focus-visible,.letter:focus-visible,.wheel:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
button[hidden]{display:none}
button:disabled{opacity:.45;cursor:not-allowed}
#sortear{
  min-width:180px;
  background:var(--mint);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
#novo{
  background:var(--yellow);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.info{margin:13px 0 9px;color:#536173;font-size:.8rem;font-weight:700}
.info strong{color:var(--ink);font-size:1rem}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.grid div{
  flex:0 0 calc((100% - 48px)/13);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  color:#707b87;
  font-size:.67rem;
  font-weight:900;
  background:#e8dcb9;
  border:1px solid #b9ad8c;
  border-radius:6px 4px 7px 4px;
}
.grid .used{
  color:var(--white);
  background:var(--coral);
  border-color:var(--ink);
  box-shadow:2px 2px 0 var(--ink);
  transform:rotate(-3deg);
}
.status{min-height:18px;margin-top:10px;color:#596779;font-size:.78rem;font-weight:700}

.overlay{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  background:#101827f2;
  cursor:pointer;
}
.overlay.show{display:flex;animation:fade .18s ease}
.stopmsg{
  color:var(--yellow);
  font:900 clamp(5rem,25vw,12rem)/.8 var(--display);
  letter-spacing:-.04em;
  -webkit-text-stroke:clamp(2px,.7vw,7px) var(--ink);
  text-shadow:8px 8px 0 var(--coral),14px 14px 0 #05080e;
  transform:rotate(-4deg);
  animation:stopPop .48s cubic-bezier(.16,1.45,.35,1);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stopPop{from{transform:rotate(-14deg) scale(.15)}to{transform:rotate(-4deg) scale(1)}}

.backdrop{
  position:fixed;
  inset:0;
  z-index:20;
  visibility:hidden;
  opacity:0;
  background:#080d17d9;
  transition:opacity .2s ease,visibility .2s;
}
.sheet{
  position:fixed;
  top:50%;
  left:50%;
  z-index:21;
  visibility:hidden;
  width:min(calc(100% - 24px),470px);
  max-height:calc(100vh - 24px);
  max-height:calc(100dvh - 24px);
  padding:18px 16px 16px;
  overflow:auto;
  overscroll-behavior:contain;
  color:var(--ink);
  text-align:center;
  background:var(--paper);
  border:3px solid #090e18;
  border-radius:24px 19px 27px 18px;
  box-shadow:9px 9px 0 var(--coral),16px 16px 0 #05080e;
  opacity:0;
  transform:translate(-50%,-46%) rotate(-.5deg) scale(.94);
  transition:transform .24s cubic-bezier(.2,.9,.3,1),opacity .18s ease,visibility .24s;
}
.backdrop.open{visibility:visible;opacity:1}
.sheet.open{visibility:visible;opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}
.sheet h2{margin:0 40px 3px;font:900 1.28rem var(--display);letter-spacing:.02em}
.sheet h3{margin:13px 0 7px;color:#596779;font:900 .8rem var(--ui);letter-spacing:.04em;text-transform:uppercase}
.close{position:absolute;top:9px;right:9px;box-shadow:3px 3px 0 var(--yellow)}

.wheelbox{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.band{
  position:absolute;
  top:46px;
  left:50%;
  width:224px;
  height:46px;
  pointer-events:none;
  background:var(--yellow);
  border:2px solid var(--ink);
  border-radius:12px 9px 13px 8px;
  transform:translateX(-50%) rotate(-1deg);
}
.wheel{
  position:relative;
  width:64px;
  height:138px;
  padding-block:46px;
  overflow-y:auto;
  outline:none;
  cursor:grab;
  scrollbar-width:none;
  scroll-snap-type:y mandatory;
  overscroll-behavior:contain;
  touch-action:pan-y;
  -webkit-user-select:none;
  user-select:none;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
  mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
}
.wheel.dragging{cursor:grabbing;scroll-snap-type:none}
.wheel::-webkit-scrollbar{display:none}
.wheel div{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ink);
  font:900 2rem var(--display);
  scroll-snap-align:center;
  scroll-snap-stop:always;
}
.tlabel{margin-top:6px;font-size:.92rem;font-weight:900}
.chips{display:flex;gap:7px;justify-content:center;margin-top:8px}
.chips button{
  padding:7px 12px;
  color:var(--ink);
  font-size:.8rem;
  background:var(--paper-2);
  border:2px solid var(--ink);
  border-radius:10px 7px 11px 7px;
  box-shadow:2px 2px 0 var(--ink);
}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lgrid button{
  position:relative;
  aspect-ratio:1;
  padding:0;
  color:var(--ink);
  font-size:1rem;
  background:var(--mint);
  border:2px solid var(--ink);
  border-radius:9px 6px 10px 6px;
  box-shadow:2px 2px 0 var(--ink);
}
.lgrid button.on::after{position:absolute;top:1px;right:4px;content:"✓";font-size:.58rem}
.lgrid button:not(.on){color:#fff;background:var(--coral-dark);opacity:.64;text-decoration:line-through}
.lgrid.locked button{pointer-events:none;opacity:.42}
.note{min-height:1em;margin:8px 0 0;color:#657184;font-size:.75rem;font-weight:700}
.note.err{color:#b42335}
#salvar{
  position:sticky;
  bottom:0;
  width:100%;
  margin-top:12px;
  color:var(--white);
  background:var(--coral-dark);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}

@media(max-width:370px){
  .card{padding-inline:10px}
  .buttons{gap:7px}
  button{padding-inline:12px;font-size:.86rem}
  #sortear{min-width:160px}
}
@media(max-height:700px){
  .brand{margin-bottom:6px}
  .logo{font-size:clamp(2rem,7.5dvh,3.1rem)}
  .subtitle{margin-top:7px;font-size:.64rem}
  .card{padding:11px 12px 10px}
  .letter{--size:min(54vw,27dvh,205px);margin-bottom:10px}
  .buttons button{padding-block:9px}
  .info{margin:8px 0 6px}
  .grid{gap:3px}
  .grid div{flex-basis:calc((100% - 36px)/13);font-size:.61rem}
  .status{margin-top:7px}
  .sheet{padding:13px}
  .sheet h3{margin:9px 0 5px}
  .lgrid{grid-template-columns:repeat(9,1fr);gap:5px}
  .lgrid button{font-size:.9rem}
  #salvar{margin-top:9px;padding-block:9px}
}
@media(max-height:620px){.subtitle{display:none}}
@media(max-height:520px) and (min-width:560px){
  .app{width:min(100%,850px)}
  .brand{display:flex;align-items:baseline;justify-content:center;gap:20px;margin-bottom:7px}
  .logo{font-size:2.1rem;text-shadow:3px 3px 0 var(--coral-dark),6px 6px 0 #080c14}
  .subtitle{display:block;margin:0}
  .card{
    display:grid;
    grid-template-columns:minmax(180px,.8fr) minmax(330px,1.2fr);
    grid-template-areas:"letter buttons" "letter info" "letter grid" "letter status";
    column-gap:22px;
    align-items:center;
    padding:13px 17px;
  }
  .letter{grid-area:letter;--size:min(62dvh,230px);margin:0}
  .buttons{grid-area:buttons}
  .info{grid-area:info}
  .grid{grid-area:grid}
  .status{grid-area:status}
  .sheet{width:min(calc(100% - 24px),790px)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .lgrid{grid-template-columns:repeat(9,1fr);gap:5px}
  .lgrid button{aspect-ratio:1.08}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="logo" aria-label="STOP!">ST<span>O</span>P!</div>
    <p class="subtitle">Sorteador de letras · sem repetir</p>
  </header>

  <section class="card" aria-label="Sorteador de letras">
    <button class="gear" id="gear" type="button" aria-label="Abrir configurações">⚙</button>

    <div class="letter" id="letra" role="button" tabindex="-1" aria-disabled="true" aria-label="Nenhuma rodada em andamento">
      <div class="fill" id="fill"></div>
      <span id="txt" aria-live="polite">?</span>
    </div>

    <div class="buttons">
      <button id="sortear" type="button">🎲 Sortear letra</button>
      <button id="novo" type="button">↻ Novo jogo</button>
    </div>

    <div class="info">Restam <strong id="restantes">26</strong> letras</div>
    <div class="grid" id="grid" aria-label="Letras do jogo"></div>
    <div class="status" id="status" role="status" aria-live="polite">Boa sorte! Que venha a próxima rodada. 😎</div>
  </section>
</main>

<div class="overlay" id="overlay" role="status" aria-live="assertive" aria-hidden="true">
  <div class="stopmsg">STOP!</div>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-labelledby="config-title" aria-modal="true" aria-hidden="true">
  <button class="close" id="fechar" type="button" aria-label="Fechar configurações">×</button>
  <h2 id="config-title">Configurações</h2>

  <div class="cols">
    <div class="sec">
      <h3>Tempo da rodada (segundos)</h3>
      <div class="wheelbox">
        <div class="band"></div>
        <div class="wheel" tabindex="0" role="spinbutton" aria-label="Centenas" aria-valuemin="0" aria-valuemax="9"></div>
        <div class="wheel" tabindex="0" role="spinbutton" aria-label="Dezenas" aria-valuemin="0" aria-valuemax="9"></div>
        <div class="wheel" tabindex="0" role="spinbutton" aria-label="Unidades" aria-valuemin="0" aria-valuemax="9"></div>
      </div>
      <div class="tlabel" id="tlabel">80 s</div>
      <div class="chips" id="chips" aria-label="Atalhos de tempo">
        <button type="button" data-t="30">30</button>
        <button type="button" data-t="60">60</button>
        <button type="button" data-t="80">80</button>
        <button type="button" data-t="120">120</button>
      </div>
    </div>

    <div class="sec">
      <h3>Letras do jogo <span id="lcount"></span></h3>
      <div class="lgrid" id="lgrid"></div>
      <div class="chips" id="lchips">
        <button id="todas" type="button">Todas</button>
        <button id="nenhuma" type="button">Nenhuma</button>
      </div>
    </div>
  </div>

  <p class="note" id="note" role="status" aria-live="polite"></p>
  <button id="salvar" type="button">Salvar configurações</button>
</section>

<script>
"use strict";

const LETRAS=Object.freeze("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));
const CONTAGEM=3;
const TEMPO_MINIMO=5;
const ALTURA_ITEM=46;
const CHAVE_CONFIG="stop_cfg";

const $=id=>document.getElementById(id);
const elLetra=$("letra");
const txt=$("txt");
const fill=$("fill");
const grid=$("grid");
const restantes=$("restantes");
const sortear=$("sortear");
const novo=$("novo");
const gear=$("gear");
const status=$("status");
const overlay=$("overlay");
const sheet=$("sheet");
const backdrop=$("backdrop");
const fechar=$("fechar");
const lgrid=$("lgrid");
const note=$("note");
const salvar=$("salvar");
const tlabel=$("tlabel");
const wheels=[...document.querySelectorAll(".wheel")];

let duracao=80;
let ativas=[...LETRAS];

try{
  const config=JSON.parse(localStorage.getItem(CHAVE_CONFIG)||"null");
  if(config&&typeof config==="object"){
    if(Number.isInteger(config.tempo)&&config.tempo>=TEMPO_MINIMO&&config.tempo<=999){
      duracao=config.tempo;
    }
    if(Array.isArray(config.letras)){
      const permitidas=new Set(config.letras.filter(item=>typeof item==="string"));
      const salvas=LETRAS.filter(letra=>permitidas.has(letra));
      if(salvas.length) ativas=salvas;
    }
  }
}catch(error){
  console.warn("Não foi possível carregar as configurações salvas.",error);
}

let disponiveis=[...ativas];
let usadas=[];
let fase="idle";
let fimDaRodada=0;
let ultimoSegundo=Infinity;
let animationFrame=null;
let countdownTimer=null;
let overlayTimer=null;
let confirmTimer=null;
let confirmandoNovoJogo=false;
let audioContext=null;
let wakeLock=null;
let focoAnterior=null;
let temp={tempo:duracao,sel:new Set(ativas)};

function salvarConfig(){
  try{
    localStorage.setItem(CHAVE_CONFIG,JSON.stringify({tempo:duracao,letras:ativas}));
  }catch(error){
    console.warn("Não foi possível salvar as configurações.",error);
  }
}

function renderizarLetras(){
  grid.replaceChildren();
  const fragmento=document.createDocumentFragment();

  ativas.forEach(letra=>{
    const item=document.createElement("div");
    item.textContent=letra;
    if(usadas.includes(letra)) item.classList.add("used");
    fragmento.appendChild(item);
  });

  grid.appendChild(fragmento);
  restantes.textContent=String(disponiveis.length);
  grid.setAttribute("aria-label",`${usadas.length} de ${ativas.length} letras sorteadas`);
}

function atualizarControles(){
  const ocupada=fase!=="idle";
  const valendo=fase==="running";

  sortear.hidden=ocupada;
  sortear.disabled=disponiveis.length===0;
  novo.disabled=fase==="countdown";
  gear.disabled=ocupada;
  gear.classList.toggle("off",ocupada);
  elLetra.classList.toggle("live",valendo);
  elLetra.tabIndex=valendo?0:-1;
  elLetra.setAttribute("aria-disabled",String(!valendo));

  if(valendo){
    elLetra.setAttribute("aria-label",`Letra ${txt.textContent}. Pressione para dar STOP`);
  }else if(fase==="countdown"){
    elLetra.setAttribute("aria-label",`Contagem regressiva: ${txt.textContent}`);
  }else{
    elLetra.setAttribute("aria-label","Nenhuma rodada em andamento");
  }
}

function definirNivel(valor){
  const nivel=Math.max(0,Math.min(1,valor));
  fill.style.transform=`scaleY(${nivel})`;
  elLetra.classList.toggle("warn",nivel<=.25&&nivel>.12);
  elLetra.classList.toggle("danger",nivel<=.12);
}

function iniciarAudio(){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass) return false;
    if(!audioContext) audioContext=new AudioContextClass();
    if(audioContext.state==="suspended") void audioContext.resume();
    return true;
  }catch(error){
    audioContext=null;
    return false;
  }
}

function beep(frequencia,duracao,tipo="sine",volume=.12){
  if(!audioContext) return;
  try{
    const oscilador=audioContext.createOscillator();
    const ganho=audioContext.createGain();
    oscilador.type=tipo;
    oscilador.frequency.value=frequencia;
    ganho.gain.setValueAtTime(volume,audioContext.currentTime);
    ganho.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duracao);
    oscilador.connect(ganho);
    ganho.connect(audioContext.destination);
    oscilador.start();
    oscilador.stop(audioContext.currentTime+duracao);
  }catch(error){
    console.warn("Não foi possível reproduzir o aviso sonoro.",error);
  }
}

function beepContagem(numero){
  beep(numero===1?880:660,.16,"sine",.14);
}

function tick(segundos){
  beep(segundos<=3?1500:1100,.045,"square",segundos<=3?.07:.045);
}

function somDeStop(){
  if(!audioContext) return;

  try{
    const inicio=audioContext.currentTime;
    const saida=audioContext.destination;
    const tamanho=Math.floor(audioContext.sampleRate*.25);
    const buffer=audioContext.createBuffer(1,tamanho,audioContext.sampleRate);
    const dados=buffer.getChannelData(0);

    for(let indice=0;indice<tamanho;indice++){
      dados[indice]=(Math.random()*2-1)*Math.pow(1-indice/tamanho,3);
    }

    const ruido=audioContext.createBufferSource();
    const filtro=audioContext.createBiquadFilter();
    const ganhoRuido=audioContext.createGain();
    ruido.buffer=buffer;
    filtro.type="lowpass";
    filtro.frequency.value=1800;
    ganhoRuido.gain.value=.5;
    ruido.connect(filtro);
    filtro.connect(ganhoRuido);
    ganhoRuido.connect(saida);
    ruido.start(inicio);

    const grave=audioContext.createOscillator();
    const ganhoGrave=audioContext.createGain();
    grave.frequency.setValueAtTime(160,inicio);
    grave.frequency.exponentialRampToValueAtTime(40,inicio+.25);
    ganhoGrave.gain.setValueAtTime(.6,inicio);
    ganhoGrave.gain.exponentialRampToValueAtTime(.001,inicio+.3);
    grave.connect(ganhoGrave);
    ganhoGrave.connect(saida);
    grave.start(inicio);
    grave.stop(inicio+.3);

    const apito=audioContext.createOscillator();
    const ganhoApito=audioContext.createGain();
    const tremolo=audioContext.createOscillator();
    const ganhoTremolo=audioContext.createGain();
    const inicioApito=inicio+.08;
    const fimApito=inicio+.72;
    apito.frequency.setValueAtTime(2800,inicioApito);
    apito.frequency.linearRampToValueAtTime(3100,inicioApito+.12);
    apito.frequency.linearRampToValueAtTime(2900,fimApito);
    ganhoApito.gain.setValueAtTime(.0001,inicioApito);
    ganhoApito.gain.linearRampToValueAtTime(.16,inicioApito+.03);
    ganhoApito.gain.setValueAtTime(.16,fimApito-.12);
    ganhoApito.gain.linearRampToValueAtTime(.0001,fimApito);
    tremolo.frequency.value=38;
    ganhoTremolo.gain.value=.07;
    tremolo.connect(ganhoTremolo);
    ganhoTremolo.connect(ganhoApito.gain);
    apito.connect(ganhoApito);
    ganhoApito.connect(saida);
    apito.start(inicioApito);
    tremolo.start(inicioApito);
    apito.stop(fimApito);
    tremolo.stop(fimApito);
  }catch(error){
    console.warn("Não foi possível reproduzir o som de STOP.",error);
  }
}

async function manterTelaAcesa(){
  try{
    if("wakeLock" in navigator&&!wakeLock){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{wakeLock=null},{once:true});
    }
  }catch(error){
    wakeLock=null;
  }
}

function liberarTela(){
  const bloqueio=wakeLock;
  wakeLock=null;
  if(bloqueio){
    try{void bloqueio.release();}catch(error){}
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&fase!=="idle") void manterTelaAcesa();
});

function animarLetra(){
  elLetra.classList.remove("pop");
  void elLetra.offsetWidth;
  elLetra.classList.add("pop");
}

function atualizarCronometro(agora){
  if(fase!=="running") return;

  const restante=Math.max(0,fimDaRodada-agora);
  definirNivel(restante/(duracao*1000));
  const segundos=Math.ceil(restante/1000);

  if(restante>0&&segundos<=10&&segundos!==ultimoSegundo){
    ultimoSegundo=segundos;
    tick(segundos);
  }

  if(restante<=0){
    encerrarRodada("tempo");
    return;
  }

  animationFrame=requestAnimationFrame(atualizarCronometro);
}

function iniciarCronometro(){
  if(animationFrame!==null) cancelAnimationFrame(animationFrame);
  fase="running";
  fimDaRodada=performance.now()+duracao*1000;
  ultimoSegundo=Infinity;
  definirNivel(1);
  atualizarControles();
  animationFrame=requestAnimationFrame(atualizarCronometro);
}

function iniciarContagem(letra){
  fase="countdown";
  definirNivel(1);
  atualizarControles();
  elLetra.classList.add("countdown");

  let numero=CONTAGEM;
  const mostrarNumero=()=>{
    txt.textContent=String(numero);
    elLetra.setAttribute("aria-label",`Contagem regressiva: ${numero}`);
    beepContagem(numero);
    elLetra.classList.remove("countdown");
    void elLetra.offsetWidth;
    elLetra.classList.add("countdown");

    if(numero>1){
      numero--;
      countdownTimer=setTimeout(mostrarNumero,1000);
      return;
    }

    countdownTimer=setTimeout(()=>{
      countdownTimer=null;
      elLetra.classList.remove("countdown");
      txt.textContent=letra;
      animarLetra();
      status.textContent=`Letra ${letra}! Toque na letra para dar STOP 👆`;
      renderizarLetras();
      iniciarCronometro();
    },1000);
  };

  mostrarNumero();
}

function sortearLetra(){
  if(!disponiveis.length||fase!=="idle") return;
  iniciarAudio();
  void manterTelaAcesa();

  const indice=Math.floor(Math.random()*disponiveis.length);
  const letra=disponiveis.splice(indice,1)[0];
  usadas.push(letra);
  status.textContent="Prepare a caneta... ✍️";
  iniciarContagem(letra);
}

function mostrarStop(){
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
  clearTimeout(overlayTimer);
  overlayTimer=setTimeout(esconderStop,1800);
}

function esconderStop(){
  clearTimeout(overlayTimer);
  overlayTimer=null;
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
}

function encerrarRodada(motivo){
  if(fase!=="running") return;
  if(animationFrame!==null) cancelAnimationFrame(animationFrame);
  animationFrame=null;
  fase="idle";

  if(motivo==="tempo") definirNivel(0);
  elLetra.classList.remove("warn","danger","pop");
  status.textContent=motivo==="tempo"
    ?"⏰ Tempo esgotado! STOP!"
    :"🛑 STOP! Rodada encerrada!";

  if(!disponiveis.length) status.textContent+=" Acabaram as letras!";

  iniciarAudio();
  somDeStop();
  if("vibrate" in navigator) navigator.vibrate([250,80,250]);
  liberarTela();
  mostrarStop();
  resetarConfirmacao();
  atualizarControles();
}

function resetarConfirmacao(){
  clearTimeout(confirmTimer);
  confirmTimer=null;
  confirmandoNovoJogo=false;
  novo.textContent="↻ Novo jogo";
}

function novoJogo(){
  liberarTela();
  if(animationFrame!==null) cancelAnimationFrame(animationFrame);
  clearTimeout(countdownTimer);
  animationFrame=null;
  countdownTimer=null;
  esconderStop();
  resetarConfirmacao();

  disponiveis=[...ativas];
  usadas=[];
  fase="idle";
  txt.textContent="?";
  elLetra.classList.remove("countdown","pop","warn","danger");
  definirNivel(1);
  status.textContent="Novo jogo! Boa sorte! 😎";
  atualizarControles();
  renderizarLetras();
}

function letrasTravadas(){
  return usadas.length>0;
}

function atualizarIndiceRoda(wheel,indice){
  const valor=Math.max(0,Math.min(9,indice));
  wheel._indice=valor;
  wheel.setAttribute("aria-valuenow",String(valor));
  return valor;
}

function lerTempoDasRodas(){
  temp.tempo=wheels[0]._indice*100+wheels[1]._indice*10+wheels[2]._indice;
  validarConfig();
}

function irParaTempo(tempo){
  const valor=Math.max(0,Math.min(999,Math.trunc(tempo)));
  const digitos=[Math.floor(valor/100),Math.floor(valor/10)%10,valor%10];

  wheels.forEach((wheel,indice)=>{
    atualizarIndiceRoda(wheel,digitos[indice]);
    wheel.scrollTop=digitos[indice]*ALTURA_ITEM;
  });

  temp.tempo=valor;
  validarConfig();
}

wheels.forEach(wheel=>{
  const fragmento=document.createDocumentFragment();
  for(let numero=0;numero<=9;numero++){
    const item=document.createElement("div");
    item.textContent=String(numero);
    fragmento.appendChild(item);
  }
  wheel.appendChild(fragmento);
  atualizarIndiceRoda(wheel,0);

  wheel.addEventListener("scroll",()=>{
    const indice=Math.round(wheel.scrollTop/ALTURA_ITEM);
    if(atualizarIndiceRoda(wheel,indice)!==wheel._ultimoIndice){
      wheel._ultimoIndice=wheel._indice;
      if("vibrate" in navigator) navigator.vibrate(4);
      beep(1300,.025,"square",.03);
    }
    clearTimeout(wheel._timer);
    wheel._timer=setTimeout(lerTempoDasRodas,70);
  },{passive:true});

  wheel.addEventListener("keydown",event=>{
    const comandos={ArrowUp:-1,ArrowDown:1,PageUp:-3,PageDown:3,Home:-9,End:9};
    if(!(event.key in comandos)) return;
    event.preventDefault();
    let proximo;
    if(event.key==="Home") proximo=0;
    else if(event.key==="End") proximo=9;
    else proximo=wheel._indice+comandos[event.key];
    proximo=atualizarIndiceRoda(wheel,proximo);
    wheel.scrollTo({top:proximo*ALTURA_ITEM,behavior:"smooth"});
    setTimeout(lerTempoDasRodas,170);
  });

  let arrastando=false;
  let inicioY=0;
  let inicioScroll=0;

  wheel.addEventListener("pointerdown",event=>{
    if(event.pointerType!=="mouse"||event.button!==0) return;
    arrastando=true;
    inicioY=event.clientY;
    inicioScroll=wheel.scrollTop;
    wheel.classList.add("dragging");
    wheel.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  wheel.addEventListener("pointermove",event=>{
    if(!arrastando) return;
    wheel.scrollTop=inicioScroll+(inicioY-event.clientY);
  });

  const finalizarArrasto=event=>{
    if(!arrastando) return;
    arrastando=false;
    wheel.classList.remove("dragging");
    if(wheel.hasPointerCapture(event.pointerId)) wheel.releasePointerCapture(event.pointerId);
    const indice=atualizarIndiceRoda(wheel,Math.round(wheel.scrollTop/ALTURA_ITEM));
    wheel.scrollTo({top:indice*ALTURA_ITEM,behavior:"smooth"});
    setTimeout(lerTempoDasRodas,170);
  };

  wheel.addEventListener("pointerup",finalizarArrasto);
  wheel.addEventListener("pointercancel",finalizarArrasto);
});

function montarSeletorDeLetras(){
  const travadas=letrasTravadas();
  lgrid.replaceChildren();
  lgrid.classList.toggle("locked",travadas);
  const fragmento=document.createDocumentFragment();

  LETRAS.forEach(letra=>{
    const botao=document.createElement("button");
    const marcada=temp.sel.has(letra);
    botao.type="button";
    botao.textContent=letra;
    botao.classList.toggle("on",marcada);
    botao.setAttribute("aria-pressed",String(marcada));
    botao.setAttribute("aria-label",`${letra}: ${marcada?"incluída":"excluída"}`);
    botao.disabled=travadas;
    botao.addEventListener("click",()=>{
      if(temp.sel.has(letra)) temp.sel.delete(letra);
      else temp.sel.add(letra);
      montarSeletorDeLetras();
      validarConfig();
    });
    fragmento.appendChild(botao);
  });

  lgrid.appendChild(fragmento);
  $("lcount").textContent=`(${temp.sel.size} de 26)`;
  $("lchips").hidden=travadas;
}

function validarConfig(){
  tlabel.textContent=`${temp.tempo} s`;
  let mensagem="";
  let invalida=false;

  if(temp.tempo<TEMPO_MINIMO){
    mensagem=`O tempo mínimo é ${TEMPO_MINIMO} segundos.`;
    invalida=true;
  }else if(!temp.sel.size){
    mensagem="Deixe pelo menos 1 letra marcada.";
    invalida=true;
  }else if(letrasTravadas()){
    mensagem="As letras ficam travadas até iniciar um novo jogo.";
  }

  note.textContent=mensagem;
  note.classList.toggle("err",invalida);
  salvar.disabled=invalida;
  $("lcount").textContent=`(${temp.sel.size} de 26)`;
}

function abrirConfig(){
  if(fase!=="idle") return;
  iniciarAudio();
  focoAnterior=document.activeElement;
  temp={tempo:duracao,sel:new Set(ativas)};
  montarSeletorDeLetras();
  irParaTempo(duracao);
  sheet.classList.add("open");
  backdrop.classList.add("open");
  sheet.setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>fechar.focus());
}

function fecharConfig(){
  if(!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  backdrop.classList.remove("open");
  sheet.setAttribute("aria-hidden","true");
  if(focoAnterior instanceof HTMLElement) focoAnterior.focus();
}

function manterFocoNoModal(event){
  if(event.key!=="Tab"||!sheet.classList.contains("open")) return;
  const focaveis=[...sheet.querySelectorAll("button:not(:disabled),[tabindex='0']")]
    .filter(elemento=>elemento.offsetParent!==null);
  if(!focaveis.length) return;
  const primeiro=focaveis[0];
  const ultimo=focaveis[focaveis.length-1];

  if(event.shiftKey&&document.activeElement===primeiro){
    event.preventDefault();
    ultimo.focus();
  }else if(!event.shiftKey&&document.activeElement===ultimo){
    event.preventDefault();
    primeiro.focus();
  }
}

$("chips").addEventListener("click",event=>{
  const botao=event.target.closest("button[data-t]");
  if(!botao) return;
  irParaTempo(Number(botao.dataset.t));
});

$("todas").addEventListener("click",()=>{
  if(letrasTravadas()) return;
  temp.sel=new Set(LETRAS);
  montarSeletorDeLetras();
  validarConfig();
});

$("nenhuma").addEventListener("click",()=>{
  if(letrasTravadas()) return;
  temp.sel=new Set();
  montarSeletorDeLetras();
  validarConfig();
});

salvar.addEventListener("click",()=>{
  lerTempoDasRodas();
  if(salvar.disabled) return;

  duracao=temp.tempo;
  if(!letrasTravadas()){
    ativas=LETRAS.filter(letra=>temp.sel.has(letra));
    disponiveis=[...ativas];
    renderizarLetras();
  }

  salvarConfig();
  atualizarControles();
  status.textContent=`Configurações salvas: ${duracao} s, ${ativas.length} letras.`;
  fecharConfig();
});

gear.addEventListener("click",abrirConfig);
fechar.addEventListener("click",fecharConfig);
backdrop.addEventListener("click",fecharConfig);
sortear.addEventListener("click",sortearLetra);
overlay.addEventListener("click",esconderStop);

novo.addEventListener("click",()=>{
  if(usadas.length&&!confirmandoNovoJogo){
    confirmandoNovoJogo=true;
    novo.textContent="Confirmar: zerar jogo?";
    confirmTimer=setTimeout(resetarConfirmacao,3000);
    return;
  }
  novoJogo();
});

elLetra.addEventListener("click",()=>encerrarRodada("stop"));
elLetra.addEventListener("keydown",event=>{
  if((event.key==="Enter"||event.key===" ")&&fase==="running"){
    event.preventDefault();
    encerrarRodada("stop");
  }
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") fecharConfig();
  manterFocoNoModal(event);
});

renderizarLetras();
atualizarControles();
</script>
</body>
